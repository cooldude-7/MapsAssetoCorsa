[project]
name = "driftmaps"
version = "0.1.0"
description = "Turn real roads into Assetto Corsa tracks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
    "rasterio>=1.5.2",
    "scipy>=1.18.1",
    "typer>=0.12",
]

[project.scripts]
drift-maps = "driftmaps.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/driftmaps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
# Throwaway research spikes are kept as found, not maintained code.
extend-exclude = ["docs/research/spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Typer declares CLI options as call defaults by design.
"src/driftmaps/cli.py" = ["B008"]
