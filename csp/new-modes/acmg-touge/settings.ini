[SETTINGS]
AI_LEVEL=95 ; AI level, % (100 is Content Manager’s 100%); from 70 to 115, round to 1
AI_AGGRESSION=50 ; AI aggression, %; from 0 to 100, round to 1
AI_GRIP=120 ; AI tyre grip, % (CSP gives AI 120% by default; 100 is the same grip as you); from 100 to 130, round to 1
START_STYLE=SIDE_BY_SIDE ; Start; SIDE_BY_SIDE for Side by side, CHASE for Chase (AI leads, you start one car length behind), LEAD for Lead (you lead, AI chases)
COUNTDOWN=3 ; Countdown before a rerun, seconds; from 2 to 5, round to 1
BRAKE_AFTER_FINISH=1 ; Brake your car automatically after you pass B; 1 or 0
